name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Offline contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Use the reviewed npm resolver
        working-directory: ${{ runner.temp }}
        run: |
          PM="$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").packageManager')"
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - run: npm ci --ignore-scripts
      - name: Verify fresh dependency resolution without the committed lockfile
        run: |
          fresh="$(mktemp -d)"
          cp package.json "$fresh/package.json"
          npm install --prefix "$fresh" --ignore-scripts
          npm ls --prefix "$fresh" undici --all
          npm audit --prefix "$fresh" --package-lock-only
      - run: npm run check:compat
        env:
          PI_OFFLINE: "1"

  native-hosts:
    name: Native and Pi hosts (macOS)
    runs-on: macos-latest
    timeout-minutes: 6
    env:
      AUTOMATION_REF: cad44b229af2d6fae39b516548de9eaf8ae91e07
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Use the reviewed npm resolver
        working-directory: ${{ runner.temp }}
        run: |
          PM="$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").packageManager')"
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - run: npm ci --ignore-scripts
      - name: Official Pi CLI
        run: node .github/scripts/validate-pi-cli.mjs
      - name: Check fork supported floor
        id: fork_support
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          test "$(git -C fork rev-parse HEAD)" = "$FORK_REF"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createRequire, findPackageJSON } from 'node:module';
          const { valid, gte } = createRequire(findPackageJSON('@earendil-works/pi-coding-agent', import.meta.url))('semver');
          const version = JSON.parse(readFileSync('fork/packages/coding-agent/package.json', 'utf8')).version;
          if (!valid(version)) throw new Error(`Invalid fork version: ${version}`);
          const floor = JSON.parse(readFileSync('package.json', 'utf8')).devDependencies?.['@earendil-works/pi-coding-agent'];
          if (!valid(floor)) throw new Error(`Invalid floor version: ${floor}`);
          const supported = gte(version, floor);
          const receipt = {
            repository: 'fitchmultz/pi', ref: 'main', commit: process.env.FORK_REF,
            version, supportedFloor: floor, status: supported ? 'ELIGIBLE' : 'UNATTEMPTED',
            qualification: supported
              ? 'Full fork build and host/CLI checks follow; eligibility is not a pass.'
              : 'Below supported floor; fork build and host/CLI checks are unattempted. Future supported fork remains unqualified.',
          };
          const json = JSON.stringify(receipt, null, 2);
          writeFileSync(join(process.env.RUNNER_TEMP, 'fork-host-eligibility.json'), `${json}\n`);
          console.log(json);
          appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Fork host eligibility\n\n\`\`\`json\n${json}\n\`\`\`\n`);
          NODE
      - name: Cache fork package
        id: fork_cache
        if: steps.fork_support.outputs.supported == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-package
          key: pi-fork-${{ runner.os }}-${{ runner.arch }}-${{ steps.fork.outputs.commit }}-${{ env.AUTOMATION_REF }}-${{ hashFiles('fork/package-lock.json') }}
      - name: Build the current fork
        if: steps.fork_support.outputs.supported == 'true' && steps.fork_cache.outputs.cache-hit != 'true'
        working-directory: fork
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$FORK_REF"
          npm ci --ignore-scripts
          npm run hydrate:model-data
          PI_OFFLINE=1 npm run build:offline
          git diff --exit-code
          node --input-type=module <<'NODE'
          import { join, resolve } from 'node:path';
          import { rmSync } from 'node:fs';
          import { produceArtifactSet } from './scripts/package-artifacts.mjs';
          import { installConsumer } from './scripts/local-package-install.mjs';
          const artifactsDir = join(process.env.RUNNER_TEMP, 'fork-artifacts');
          try {
            const artifactSet = produceArtifactSet({ repoRoot: resolve('.'), outDir: artifactsDir, build: false, force: true });
            installConsumer({
              artifactSet,
              directory: join(process.env.RUNNER_TEMP, 'fork-package'),
              packageNames: ['@earendil-works/pi-coding-agent'],
            });
          } finally {
            rmSync(artifactsDir, { force: true, recursive: true });
          }
          NODE
      - name: Fork Pi CLI
        if: steps.fork_support.outputs.supported == 'true'
        run: node .github/scripts/validate-pi-cli.mjs "$RUNNER_TEMP/fork-package/node_modules/@earendil-works/pi-coding-agent"
