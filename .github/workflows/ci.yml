name: Linux headless portability

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Native macOS qualification is in shared compatibility. This retains the
  # distinct non-desktop Linux portability gate, not a Linux Computer Use claim.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:compat
        env:
          PI_OFFLINE: '1'
          PI_COMPAT_HOST: official
      - name: Linux native CLI startup (not desktop qualification)
        env:
          PI_OFFLINE: '1'
        run: |
          cli=$(node --input-type=module -e '
            import { findPackageJSON } from "node:module";
            import { readFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            const manifest = findPackageJSON("@earendil-works/pi-coding-agent", import.meta.url);
            console.log(resolve(dirname(manifest), JSON.parse(readFileSync(manifest, "utf8")).bin.pi));
          ')
          node "$cli" --no-context-files --no-skills --no-prompt-templates --no-themes --no-extensions \
            -e ./extensions/codex-computer-use.ts --list-models '__no_such_model__'
