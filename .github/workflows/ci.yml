name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Offline contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check:compat
        env:
          PI_OFFLINE: '1'

  native-hosts:
    name: Native and Pi hosts (macOS)
    runs-on: macos-latest
    timeout-minutes: 6
    env:
      PI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: node --test tools/tests/macos-focus.test.mjs
      - run: npm ci --ignore-scripts
      - name: Official Pi host and CLI
        run: |
          node tools/validate-pi-host.mjs
          node .github/scripts/validate-pi-cli.mjs
      - name: Check fork supported floor
        id: fork_support
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          test "$(git -C fork rev-parse HEAD)" = "$FORK_REF"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { createRequire, findPackageJSON } from 'node:module';
          const { valid, gte } = createRequire(findPackageJSON('@earendil-works/pi-coding-agent', import.meta.url))('semver');
          const version = JSON.parse(readFileSync('fork/packages/coding-agent/package.json', 'utf8')).version;
          if (!valid(version)) throw new Error(`Invalid fork version: ${version}`);
          const floor = '1.0.0';
          const supported = gte(version, floor);
          const receipt = {
            repository: 'fitchmultz/pi', ref: 'main', commit: process.env.FORK_REF,
            version, supportedFloor: floor, status: supported ? 'ELIGIBLE' : 'UNATTEMPTED',
            qualification: supported
              ? 'Full fork build and host/CLI checks follow; eligibility is not a pass.'
              : 'Below supported floor; fork build and host/CLI checks are unattempted. Future supported fork remains unqualified.',
          };
          const json = JSON.stringify(receipt, null, 2);
          writeFileSync(join(process.env.RUNNER_TEMP, 'fork-host-eligibility.json'), `${json}\n`);
          console.log(json);
          appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Fork host eligibility\n\n\`\`\`json\n${json}\n\`\`\`\n`);
          NODE
      - name: Build the current fork
        if: steps.fork_support.outputs.supported == 'true'
        working-directory: fork
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$FORK_REF"
          npm ci --ignore-scripts
          npm run hydrate:model-data
          PI_OFFLINE=1 npm run build:offline
          git diff --exit-code
      - name: Fork Pi host and CLI
        if: steps.fork_support.outputs.supported == 'true'
        run: |
          node tools/validate-pi-host.mjs "$GITHUB_WORKSPACE/fork/packages/coding-agent"
          node .github/scripts/validate-pi-cli.mjs "$GITHUB_WORKSPACE/fork/packages/coding-agent"
