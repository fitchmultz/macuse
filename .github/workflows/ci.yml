name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --check tools/probe-codex-computer-use-mcp.mjs
      - run: node --check tools/codex-computer-use-appserver.mjs
      - run: node --check tools/codex-computer-use-appserver-mcp.mjs
      - run: npx --no-install pi --no-context-files --no-skills --no-prompt-templates --no-themes --no-extensions -e ./extensions/codex-computer-use.ts --list-models '__no_such_model__'
        env:
          PI_OFFLINE: "1"
      - run: npm run pack:check
